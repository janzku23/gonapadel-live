<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GonaPadel – Live</title>
<link rel="stylesheet" href="live.css?v=3">
<script src="live-i18n.js?v=1"></script>
<script src="live-presentation.js?v=4"></script>
<meta name="theme-color" content="#ff9c19">
</head>
<body class="americano">
<div class="page-shell">
<header class="brand-header">
 <div class="brand-top"><span class="wordmark">GONA<span>PADEL</span></span><span class="live-label">LIVE SCORE / AMERICANO</span></div>
 <div class="brand-intro"><p class="eyebrow" data-i18n="eyebrow">KENTÄLTÄ SUORAAN SINULLE</p><h1 data-i18n="headline">Peli elää. Seuraa mukana.</h1><p data-i18n="intro">Tulokset, sijoitukset ja kenttien tapahtumat yhdessä paikassa.</p></div>
 <div class="partners" aria-label="Bueno Padel, Seinä-Joe Padel &amp; Bueno Sport Bar">
  <div class="partner padel"><img src="bueno-padel.png" alt="Bueno Padel" width="512" height="205"></div>
  <div class="partner joe"><img src="seina-joe.png" alt="Seinä-Joe Padel" width="512" height="512"></div>
  <div class="partner bar"><img src="bueno-sport-bar.png" alt="Bueno Sport Bar" width="512" height="512"></div>
 </div>
</header>
<main class="wrap">
  <h1 id="title">Ladataan…</h1>
  <div class="sub">
    <span id="meta" class="badge">–</span>
    <span id="state" class="badge live">Live</span>
  </div>

  <h2 class="section-heading" id="standings-heading" data-i18n="standings">Pistetaulukko</h2>
  <table aria-label="Pelaajien sijoitukset" data-i18n-aria="standingsLabel">
    <thead>
      <tr>
        <th data-i18n="player">Pelaaja</th>
        <th class="right" data-i18n="points">Pisteet</th>
        <th class="right">±</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <!-- Kierrokset & kentät -->
  <h2 class="section-heading rounds-heading" data-i18n="roundsCourts">Kierrokset &amp; kentät</h2>
  <div class="courts" id="courts"></div>

  <div class="footer" id="updated">Päivitetty: –</div>
  <div class="err" id="err"></div>
</main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL  = "https://bxklcpvwtaeklormsdsk.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4a2xjcHZ3dGFla2xvcm1zZHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyOTE4MzgsImV4cCI6MjA3ODg2NzgzOH0.bV5-yhGlnHkPBXY_vdirMZjWhPzoiL7OU7txTfexPBA";

  const t = LiveI18n.t;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  const id      = new URLSearchParams(location.search).get("id");
  const $title  = document.getElementById("title");
  const $meta   = document.getElementById("meta");
  const $state  = document.getElementById("state");
  const $rows   = document.getElementById("rows");
  const $upd    = document.getElementById("updated");
  const $err    = document.getElementById("err");
  const $courts = document.getElementById("courts");

  $title.textContent = t("loading");
  $upd.textContent = t("updatedInitial");

  if (!id) {
    $title.textContent = t("missingId");
    throw new Error("no id");
  }

  const getVal = (obj, camel, lower) => (obj?.[camel] ?? obj?.[lower]);

  async function loadOnce(){
    const { data, error } = await sb
      .from("americano")
      .select("*")
      .eq("id", id)
      .maybeSingle();

    if (error) {
      console.error("select error:", error);
      $err.textContent = t("loadError") + " " + (error.message || String(error));
      return;
    }
    if (!data) {
      $title.textContent = t("notFound");
      $rows.innerHTML = "";
      $meta.textContent = "–";
      $state.textContent = t("noData");
      $state.className = "badge";
      $courts.innerHTML = "";
      $upd.textContent = t("updatedInitial");
      return;
    }
    render(data);
  }

  await loadOnce();

  sb.channel("realtime:americano")
    .on(
      "postgres_changes",
      { event:"*", schema:"public", table:"americano", filter:`id=eq.${id}` },
      (payload) => render(payload.new ?? payload.old)
    )
    .subscribe();

  function render(d){
    if (!d) return;

    const pointsPerRound = getVal(d, "pointsPerRound", "pointsperround");
    const currentRound   = getVal(d, "currentRound",   "currentround");
    const totalRounds    = getVal(d, "totalRounds",    "totalrounds");
    const isFinished     = getVal(d, "isFinished",     "isfinished");
    const updatedAtRaw   = getVal(d, "updatedAt",      "updatedat");

    $title.textContent = d.name || "Americano";
    $meta.textContent  = t("roundMeta", {current:currentRound, total:totalRounds, points:pointsPerRound});
    $state.textContent = isFinished ? t("finished") : t("live");
    $state.className   = "badge " + (isFinished ? "" : "live");

    // Pistetaulukko
    const players = (d.players || []).slice()
      .sort((a,b)=> (b.totalPoints||0)-(a.totalPoints||0));

    $rows.innerHTML = players.map(p => `
      <tr>
        <td>${esc(p.name||"-")}</td>
        <td class="right">${p.totalPoints ?? 0}</td>
        <td class="right pm">${esc(p.pm50 || "0")}</td>
      </tr>`
    ).join("");

    // Kaikki kierrokset & kentät
    const matches = getVal(d, "matches", "matches") || [];
    if (!matches || matches.length === 0) {
      $courts.innerHTML = "";
    } else {
      // Ryhmitellään kierroksen mukaan
      const byRound = new Map();
      for (const m of matches) {
        const r = m.round ?? m.roundIndex ?? 0;
        if (!byRound.has(r)) byRound.set(r, []);
        byRound.get(r).push(m);
      }

      const sortedRounds = Array.from(byRound.keys())
        .filter(r => r > 0)
        .sort((a,b) => a - b);

      const html = sortedRounds.map(r => {
        const games = byRound.get(r).slice()
          .sort((a,b) => (a.court ?? 0) - (b.court ?? 0));

        // Onko kierros valmis? (kaikilla scoreA on numero)
        const finished = games.every(m =>
          typeof m.scoreA === "number"
        );

        const gamesHtml = games.map(m => {
          const court = m.court ?? m.courtIndex ?? "?";
          const teamA = (m.teamA || []).join(" & ");
          const teamB = (m.teamB || []).join(" & ");

          let scoreText = "–";
          if (typeof m.scoreA === "number" && typeof m.scoreB === "number") {
            scoreText = `${m.scoreA}–${m.scoreB}`;
          }

          return `
            <div class="court">
              <div class="court-header">
                <div class="court-title">${t("court")} ${esc(String(court))}</div>
                <div class="court-score">${esc(scoreText)}</div>
              </div>
              <div class="court-teams">
                <span>${esc(teamA)}</span>
                <span>vs</span>
                <span>${esc(teamB)}</span>
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="round">
            <div class="round-title">
              <span>${t("round")} ${r}/${totalRounds}</span>
              ${finished ? '<span class="round-check">✓</span>' : ''}
            </div>
            ${gamesHtml}
          </div>
        `;
      }).join("");

      $courts.innerHTML = html;
    }

    const dt = updatedAtRaw ? new Date(updatedAtRaw) : new Date();
    $upd.textContent = t("updated") + " " + dt.toLocaleString(LiveI18n.locale);
    $err.textContent = "";
    LivePresentation.update(d, "americano");
  }

  function esc(s){
    return (s??"").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>
<footer class="site-footer"><span>GONA PADEL</span><span data-i18n="tagline">Oma peli. Yhteinen kenttä.</span></footer>
</div>
</body>
</html>
